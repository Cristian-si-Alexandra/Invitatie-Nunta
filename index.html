<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitatie</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #dfe4e8;
    --ink: #2b3a47;
    --btn-bg: #2b3a47;
    --btn-ink: #f4f5f6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #151c23;
      --ink: #c5d0d9;
      --btn-bg: #c5d0d9;
      --btn-ink: #151c23;
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Caveat", "Segoe Script", "Bradley Hand", cursive;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 12px; box-sizing: border-box;
  }
  #stage { height: min(88vh, 150vw); width: auto; max-width: 100%; overflow: visible; }

  .half { transition: transform 1.25s cubic-bezier(.65,.02,.2,1), filter 1.25s ease, opacity .5s ease; }
  #left  { transform-origin: 20px 450px; }
  #right { transform-origin: 580px 450px; transition-delay: .06s; }
  .open #left  { transform: scaleX(.17) skewY(-3.5deg); filter: brightness(.78); }
  .open #right { transform: scaleX(.17) skewY(3.5deg);  filter: brightness(.78); }

  #lining { transition: opacity .5s ease; }
  .half { will-change: auto; }
  .reveal #lining, .reveal .half { opacity: 0; filter: none; }
  .gone #lining, .gone .half { display: none; }
  svg { text-rendering: geometricPrecision; }

  #heart { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .3s cubic-bezier(.3,1.6,.5,1), opacity .35s; outline: none; }
  #heart:hover { transform: scale(1.07); }
  #heart:active { transform: scale(.9); }
  #heart:focus-visible .rim { stroke: #f2c14e; stroke-width: 4; }
  .beat { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
  @keyframes beat { 0%,60%,100% { transform: scale(1); } 68% { transform: scale(1.07); } 76% { transform: scale(.98); } 84% { transform: scale(1.04); } }
  .open #heart, .hh #heart { opacity: 0; transform: scale(.3); pointer-events: none; }

  #card { transform-box: fill-box; transform-origin: center; transition: transform .7s cubic-bezier(.3,.9,.3,1); }
  .lift #card { transform: translateY(-36px); filter: url(#paperShadow); }
  .reveal #card { filter: none; }
  #back { display: none; }
  body { overflow: hidden; }
  #mute { position: fixed; top: max(14px, env(safe-area-inset-top, 0px)); right: 14px; z-index: 6; width: 42px; height: 42px; border: 0; border-radius: 50%;
          background: var(--btn-bg); color: var(--btn-ink); display: grid; place-items: center; cursor: pointer; transition: opacity .5s; }
  #mute:focus-visible { outline: 3px solid #f2c14e; outline-offset: 3px; }
  #mute .slash { display: none; } #mute.off .slash { display: block; } #mute.off .waves { display: none; }
  #toggle { transition: opacity .4s; position: fixed; bottom: max(18px, env(safe-area-inset-bottom, 0px)); left: 50%; translate: -50% 0; z-index: 5; }
  #toggle {
    font: 700 22px/1 "Caveat", "Segoe Script", cursive;
    background: var(--btn-bg); color: var(--btn-ink);
    border: 0; border-radius: 999px; padding: 10px 26px; cursor: pointer;
  }
  #toggle:focus-visible { outline: 3px solid #f2c14e; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .half, #card, #heart { transition-duration: .01s !important; transition-delay: 0s !important; }
    .beat { animation: none; }
  }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 680 900" role="img" aria-label="Un sacou albastru-ardezie cu un nasture în formă de inimă. Apasă nasturele ca să deschizi invitația.">
  <defs>
    <filter id="foldShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="4" stdDeviation="4.5" flood-color="#141e26" flood-opacity="0.38"/>
    </filter>
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="5" stdDeviation="4" flood-color="#0d1318" flood-opacity="0.45"/>
    </filter>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="liningShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".3" stop-color="#000" stop-opacity="0"/>
      <stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
    <pattern id="tieStripe" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(32)">
      <rect width="6" height="16" fill="#3b5068" fill-opacity=".55"/>
    </pattern>
    <linearGradient id="cardShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".14"/><stop offset=".3" stop-color="#000" stop-opacity="0"/>
      <stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="jacketBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#768fa4"/><stop offset="50%" stop-color="#688196"/><stop offset="100%" stop-color="#5b7387"/>
    </linearGradient>
    <linearGradient id="lapelSurface" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#8098ad"/><stop offset="100%" stop-color="#6c859a"/>
    </linearGradient>
    <linearGradient id="bowLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141414"/><stop offset="45%" stop-color="#292929"/><stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="bowRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111"/><stop offset="55%" stop-color="#292929"/><stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <!-- Jacket lining (seen when the jacket opens) -->
  <g id="lining" transform="translate(300 0) scale(1.16964 1) translate(-300 0)"><rect x="20" y="30" width="560" height="840" fill="#24303a"/><rect x="20" y="30" width="560" height="840" fill="url(#liningShade)"/></g>

  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    <path class="slash" d="M17 9l5 6M22 9l-5 6"/>
  </svg>
</button>

<script>
(function () {
  var stage = document.getElementById('stage');
  var heart = document.getElementById('heart');
  var btn = document.getElementById('toggle');
  var muteBtn = document.getElementById('mute');
  var measure = document.getElementById('measure');
  var flip = document.getElementById('flip');
  var front = document.getElementById('front');
  var back = document.getElementById('back');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var state = 'closed', busy = false, T = null, raf = 0;

  /* ---------- sound (all synthesised, no files) ---------- */
  var AC = null, master = null, muted = false;
  function audio() {
    if (!AC) {
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.connect(AC.destination); } catch (e) {}
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function ding(f, vol, when) {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime + (when || 0);
    [[1, 1], [2.76, .35], [5.4, .12]].forEach(function (p) {
      var o = ac.createOscillator(), g = ac.createGain(), d = 2 / Math.sqrt(p[0]);
      o.type = 'sine'; o.frequency.value = f * p[0];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * p[1], t + .012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
    });
  }
  function swish(dur, vol, f0, f1, when) {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime + (when || 0), n = Math.floor(ac.sampleRate * dur);
    var buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    var src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; flt.type = 'bandpass'; flt.Q.value = 1.1;
    flt.frequency.setValueAtTime(f0, t); flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * .4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(master); src.start(t);
  }
  /* Slow romantic piano loop (stand-in until the real song file is added) */
  var musicOn = false, musicNext = 0, musicBar = 0, musicGain = null;
  // Canon-style progression: C G Am Em F C F G  (bass, then three upper notes) + one held melody note per bar
  var BARS = [
    { b: 130.81, u: [261.63, 329.63, 392.00], m: 659.25 }, { b: 98.00, u: [246.94, 293.66, 392.00], m: 587.33 },
    { b: 110.00, u: [261.63, 329.63, 440.00], m: 523.25 }, { b: 82.41, u: [246.94, 329.63, 392.00], m: 493.88 },
    { b: 87.31,  u: [261.63, 349.23, 440.00], m: 440.00 }, { b: 130.81, u: [261.63, 329.63, 392.00], m: 392.00 },
    { b: 87.31,  u: [261.63, 349.23, 440.00], m: 440.00 }, { b: 98.00, u: [246.94, 293.66, 392.00], m: 493.88 }
  ];
  var ARP = [0, 1, 2, 3, 2, 1, 2, 1], STEP = 0.45;
  function reverbBus() {
    var ac = AC, len = Math.floor(ac.sampleRate * 2.6), buf = ac.createBuffer(2, len, ac.sampleRate);
    for (var c = 0; c < 2; c++) { var d = buf.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    var conv = ac.createConvolver(), wet = ac.createGain();
    conv.buffer = buf; wet.gain.value = .55;
    musicGain.connect(conv); conv.connect(wet); wet.connect(master);
  }
  function tone(f, t, dur, vol, type, attack) {
    var ac = AC, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + .05);
  }
  function piano(f, t, vol) { tone(f, t, 1.8, vol, 'sine', .008); tone(f * 2, t, .7, vol * .22, 'sine', .006); tone(f * 3, t, .35, vol * .08, 'sine', .005); }
  function scheduleBar() {
    var br = BARS[musicBar % 8], all = [br.b].concat(br.u), len = STEP * 8;
    for (var i = 0; i < 8; i++) piano(all[ARP[i]] * (i === 0 ? 1 : 1), musicNext + i * STEP, i === 0 ? .5 : .3);
    br.u.forEach(function (f) { tone(f / 2, musicNext, len + .6, .05, 'triangle', 1.1); });          // warm pad
    tone(br.m, musicNext + .02, len, .26, 'sine', .04); tone(br.m * 2, musicNext + .02, len * .6, .03, 'sine', .04);  // held melody note
    musicNext += len; musicBar++;
  }
  function startMusic() {
    if (musicOn) return;
    var ac = audio(); if (!ac) return;
    musicOn = true;
    musicGain = ac.createGain();
    musicGain.gain.setValueAtTime(0.0001, ac.currentTime);
    musicGain.gain.exponentialRampToValueAtTime(0.07, ac.currentTime + 5);
    musicGain.connect(master);
    reverbBus();
    musicNext = ac.currentTime + .5;
    scheduleBar();
    setInterval(function () { while (musicNext - AC.currentTime < 4) scheduleBar(); }, 1000);
  }
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.classList.toggle('off', muted);
    muteBtn.setAttribute('aria-label', muted ? 'Pornește sunetul' : 'Oprește sunetul');
    if (master) master.gain.value = muted ? 0 : 1;
  });

  /* ---------- animation ---------- */
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function target() {
    stage.style.transform = 'none';
    var r = stage.getBoundingClientRect(), p = measure.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw * 0.94 / p.width, (vh - 70) * 0.94 / p.height);
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var px = p.left + p.width / 2, py = p.top + p.height / 2;
    return { s: s, tx: vw / 2 - cx - s * (px - cx), ty: (vh - 56) / 2 - cy - s * (py - cy) };
  }

  function apply(p) {
    var e = ease(p);
    stage.style.transform = 'translate(' + (T.tx * e) + 'px,' + (T.ty * e) + 'px) scale(' + (1 + (T.s - 1) * e) + ')';
    var th = Math.PI * ease(Math.min(1, p / 0.8));
    var sx = Math.max(Math.abs(Math.cos(th)), 0.002), sy = 1 + 0.05 * Math.sin(th);
    var front_on = th < Math.PI / 2;
    front.style.display = front_on ? '' : 'none';
    back.style.display = front_on ? 'none' : 'block';
    flip.setAttribute('transform', 'translate(300 450) scale(' + sx + ' ' + sy + ') translate(-300 -450)');
  }

  function run(from, to, dur, done) {
    cancelAnimationFrame(raf);
    if (reduce) dur = 1;
    var t0 = performance.now();
    (function step(now) {
      var k = Math.min(1, (now - t0) / dur);
      apply(from + (to - from) * k);
      if (k < 1) raf = requestAnimationFrame(step); else if (done) done();
    })(t0);
  }

  function openIt() {
    if (busy || state !== 'closed') return;
    busy = true; state = 'open';
    audio(); ding(988, .22); ding(1480, .08, .06); swish(1.0, .16, 500, 2600, .2);
    startMusic();
    muteBtn.disabled = false; muteBtn.style.opacity = '1';
    stage.classList.add('open');
    heart.setAttribute('aria-expanded', 'true');
    btn.style.opacity = '0'; btn.disabled = true;
    setTimeout(function () { stage.classList.add('lift'); swish(.45, .07, 1200, 3200); }, 1300);
    setTimeout(function () {
      document.body.classList.add('reveal-mode');
      T = target();
      stage.classList.add('reveal');
      swish(1.0, .2, 900, 4200);
      setTimeout(function () { stage.classList.add('gone'); }, 550);
      run(0, 1, 2400);
    }, 2100);
    setTimeout(function () { btn.style.opacity = '1'; btn.disabled = false; busy = false; state = 'revealed'; }, 5000);
  }

  function closeIt() {
    if (busy || state !== 'revealed') return;
    busy = true; btn.disabled = true; btn.style.opacity = '0';
    swish(1.0, .2, 4200, 900);
    stage.classList.remove('gone');
    requestAnimationFrame(function () { stage.classList.remove('reveal'); });
    run(1, 0, 2000, function () {
      stage.style.transform = 'none';
      stage.classList.add('hh');               // keep the heart hidden until the jacket is shut
      stage.classList.remove('lift');
      stage.classList.remove('open');
      heart.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('reveal-mode');
      swish(.9, .14, 2600, 500);
      setTimeout(function () { ding(659, .2); }, 1250);
      setTimeout(function () { stage.classList.remove('hh'); }, 1350);
      setTimeout(function () { state = 'closed'; busy = false; }, 1900);
    });
  }

  heart.addEventListener('click', openIt);
  heart.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openIt(); }
  });
  btn.addEventListener('click', closeIt);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeIt(); });
  window.addEventListener('resize', function () { if (state === 'revealed') { T = target(); apply(1); } });
})();
</script>
</body>
</html>
